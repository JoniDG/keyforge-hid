name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: Install hidapi
        run: sudo apt-get update && sudo apt-get install -y libhidapi-dev
      - name: Build
        run: go build ./...
      - name: Run tests
        run: |
          if [[ -z "$(find ./internal -name '*_test.go' 2>/dev/null)" ]]; then
            echo "No tests yet — skipping coverage gate. Add tests as soon as logic lands."
            exit 0
          fi
          go test -race -coverprofile=coverage.out -covermode=atomic ./internal/...
      - name: Coverage gate (≥95%)
        if: hashFiles('coverage.out') != ''
        run: |
          coverage=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Coverage: ${coverage}%"
          awk -v c="$coverage" 'BEGIN { if (c+0 < 95) { print "::error::Coverage "c"% is below the 95% minimum"; exit 1 } }'

  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: Install hidapi
        run: sudo apt-get update && sudo apt-get install -y libhidapi-dev
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
